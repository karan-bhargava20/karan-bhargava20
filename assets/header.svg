<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&amp;display=swap');
    </style>
    <!-- Subtle scan-line texture -->
    <pattern id="scanlines" x="0" y="0" width="860" height="3" patternUnits="userSpaceOnUse">
      <rect width="860" height="1" fill="#e8e4df" opacity="0.5"/>
      <rect y="1" width="860" height="2" fill="transparent"/>
    </pattern>

    <!-- Corner brackets clip -->
    <clipPath id="card-clip">
      <rect x="0" y="0" width="860" height="280" rx="2"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" fill="#F5F2EE" rx="2"/>
  <!-- Scanlines overlay -->
  <rect width="860" height="280" fill="url(#scanlines)" rx="2"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="280" fill="#1A1A1A"/>

  <!-- Meta strip text: index + country -->
  <text x="16" y="22" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" font-weight="400" fill="#A0A0A0" letter-spacing="2">PORTFOLIO</text>
  <text x="120" y="22" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" font-weight="400" fill="#4A4A4A" letter-spacing="1">—</text>
  <text x="136" y="22" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" font-weight="500" fill="#4A4A4A" letter-spacing="2">INDEX N° 001</text>

  <!-- Right side of meta strip -->
  <text x="680" y="22" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" font-weight="400" fill="#5A5A5A" letter-spacing="3">IN / INDIA</text>

  <!-- Main Name -->
  <text x="16" y="108" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="62" font-weight="600" fill="#1A1A1A" letter-spacing="-1">Karan</text>
  <text x="16" y="167" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="62" font-weight="600" fill="#1A1A1A" letter-spacing="-1">Bhargava</text>

  <!-- Vertical rule separating name from right panel -->
  <line x1="430" y1="44" x2="430" y2="240" stroke="#D8D4CF" stroke-width="0.75"/>

  <!-- Right panel: role tags -->
  <text x="450" y="75" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" font-weight="400" fill="#888" letter-spacing="3">SPECIALISATION</text>
  <line x1="450" y1="82" x2="840" y2="82" stroke="#D8D4CF" stroke-width="0.5"/>

  <!-- Role pills -->
  <rect x="450" y="94" width="130" height="24" fill="#1A1A1A" rx="1"/>
  <text x="460" y="111" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" font-weight="500" fill="#F5F2EE" letter-spacing="1">GEN AI</text>

  <rect x="592" y="94" width="200" height="24" fill="transparent" rx="1" stroke="#1A1A1A" stroke-width="1"/>
  <text x="602" y="111" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" font-weight="500" fill="#1A1A1A" letter-spacing="1">BACKEND DEV</text>

  <line x1="450" y1="130" x2="840" y2="130" stroke="#D8D4CF" stroke-width="0.5"/>

  <!-- Focus line -->
  <text x="450" y="152" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" font-weight="400" fill="#888" letter-spacing="3">FOCUS</text>
  <line x1="450" y1="158" x2="840" y2="158" stroke="#D8D4CF" stroke-width="0.5"/>
  <text x="450" y="177" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10.5" font-weight="400" fill="#333" letter-spacing="0.5">Gen Ai  ·  Backend Systems  ·  APIs</text>
  <text x="450" y="194" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10.5" font-weight="400" fill="#333" letter-spacing="0.5">Machine Learning  ·  Data Pipelines</text>

  <line x1="450" y1="206" x2="840" y2="206" stroke="#D8D4CF" stroke-width="0.5"/>

  <!-- Status / open to -->
  <text x="450" y="224" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" font-weight="400" fill="#888" letter-spacing="3">STATUS</text>
  <circle cx="522" cy="220" r="4" fill="#27C93F"/>
  <text x="532" y="224" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10.5" font-weight="400" fill="#333" letter-spacing="0.5">open · internships · freelance · collab</text>

  <!-- Bottom strip text -->
  <text x="16" y="268" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" font-weight="400" fill="#666" letter-spacing="2">MAIT — 2028</text>
  <text x="200" y="268" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" font-weight="400" fill="#444" letter-spacing="1">·  B.Tech CSE  ·  GEN AI  ·  BACKEND SYSTEMS</text>

  <!-- Corner bracket decorations (light) -->
  <polyline points="6,44 6,54 16,54" fill="none" stroke="#C8C4BF" stroke-width="1"/>
  <polyline points="420,44 420,54 410,54" fill="none" stroke="#C8C4BF" stroke-width="1"/>
  <polyline points="6,240 6,230 16,230" fill="none" stroke="#C8C4BF" stroke-width="1"/>
  <polyline points="420,240 420,230 410,230" fill="none" stroke="#C8C4BF" stroke-width="1"/>
</svg>
