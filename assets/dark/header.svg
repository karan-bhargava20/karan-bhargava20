<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 340" width="100%" height="100%">
  <style>
    .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    .text-black { fill: #FFFFFF; }
    .label { font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
    .title { font-size: 38px; font-weight: 800; letter-spacing: -0.5px; }
    .subtitle { font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }
    .body-text { font-size: 13px; font-weight: 400; }
    .badge-text { font-size: 11px; font-weight: 700; letter-spacing: 1px; }
    .ticker-text { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; }
    
    .border-line { stroke: #FFFFFF; stroke-width: 1; }
  </style>

  <!-- HEADER SECTION -->
  <!-- Index Number -->
  <text x="45" y="48" class="font-mono label text-black">PORTFOLIO - INDEX N° 001</text>
  
  <!-- Location Badge -->
  <g transform="translate(735, 33)">
    <rect x="0" y="0" width="70" height="22" rx="11" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <circle cx="14" cy="11" r="4" fill="#FFFFFF"/>
    <text x="24" y="15" class="font-sans badge-text text-black">INDIA</text>
  </g>

  <!-- Divider Line Header -->
  <line x1="45" y1="68" x2="805" y2="68" class="border-line"/>

  <!-- MAIN CONTENT SECTION -->
  <!-- Name -->
  <text x="45" y="115" class="font-sans title text-black">Karan Bhargava</text>
  
  <!-- Subtitle / Role -->
  <text x="45" y="142" class="font-sans subtitle text-black">Gen Ai  |  Backend  Development</text>

  <!-- Focus Area -->
  <g transform="translate(45, 175)">
    <text x="0" y="0" class="font-mono label text-black">FOCUS</text>
    <text x="65" y="0" class="font-sans body-text text-black">• Gen Ai • Backend Systems • APIs • Machine Learning</text>
  </g>

  <!-- Availability Pill -->
  <g transform="translate(45, 202)">
    <rect x="0" y="0" width="375" height="28" rx="14" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#FFFFFF"/>
    <text x="28" y="18" class="font-mono body-text text-black" font-size="11">
      open to internships • freelance • collaboration
    </text>
  </g>

  <!-- FOOTER TICKER SECTION -->
  <line x1="45" y1="262" x2="805" y2="262" class="border-line"/>

  <!-- Ticker Content -->
  <text x="45" y="295" class="font-mono ticker-text text-black">
    Gen Ai .  BACKEND SYSTEMS . MACHINE LEARNING . DATA PIPELINES
  </text>

  <!-- MAIT 2028 Tag -->
  <g transform="translate(685, 280)">
    <rect x="0" y="0" width="120" height="22" rx="4" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <text x="60" y="15" class="font-mono text-black" font-size="11" font-weight="700" text-anchor="middle">MAIT – 2028</text>
  </g>
</svg>
