  <text x="450" y="152" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" font-weight="400" fill="#444" letter-spacing="3">FOCUS</text>
  <line x1="450" y1="158" x2="840" y2="158" stroke="#2A2A2A" stroke-width="0.5"/>
  <text x="450" y="177" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10.5" font-weight="400" fill="#888" letter-spacing="0.5">Gen Ai  ·  Backend Systems  ·  APIs</text>
  <text x="450" y="194" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10.5" font-weight="400" fill="#888" letter-spacing="0.5">Machine Learning  ·  Data Pipelines</text>

  <line x1="450" y1="206" x2="840" y2="206" stroke="#2A2A2A" stroke-width="0.5"/>

