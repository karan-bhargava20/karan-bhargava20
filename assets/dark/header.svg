  <text x="16" y="108" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="62" font-weight="600" fill="#E8E4DF" letter-spacing="-1">Karan</text>
  <text x="16" y="167" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="62" font-weight="600" fill="#E8E4DF" letter-spacing="-1">Bhargava</text>

  <!-- Vertical rule -->
  <line x1="430" y1="44" x2="430" y2="240" stroke="#2A2A2A" stroke-width="0.75"/>

