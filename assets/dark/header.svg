<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&amp;display=swap');
    </style>
    <!-- Subtle dot-grid texture -->
    <pattern id="dotgrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.7" fill="#2A2A2A"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" fill="#0D0D0D" rx="2"/>
  <!-- Dot grid overlay -->
  <rect width="860" height="280" fill="url(#dotgrid)" rx="2" opacity="0.6"/>

  <!-- Left accent bar -->
