  <polyline points="420,44 420,54 410,54" fill="none" stroke="#2E2E2E" stroke-width="1"/>
  <polyline points="6,240 6,230 16,230" fill="none" stroke="#2E2E2E" stroke-width="1"/>
  <polyline points="420,240 420,230 410,230" fill="none" stroke="#2E2E2E" stroke-width="1"/>
