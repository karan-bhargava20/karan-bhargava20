  <text x="16" y="268" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" font-weight="400" fill="#888" letter-spacing="2">MAIT — 2028</text>
  <text x="200" y="268" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" font-weight="400" fill="#777" letter-spacing="1">·  B.Tech CSE  ·  GEN AI  ·  BACKEND SYSTEMS</text>

  <!-- Corner bracket decorations (dark) -->
