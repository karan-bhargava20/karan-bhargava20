  <!-- Meta strip text -->
  <text x="16" y="22" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" font-weight="400" fill="#555" letter-spacing="2">PORTFOLIO</text>
  <text x="120" y="22" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" font-weight="400" fill="#3A3A3A" letter-spacing="1">—</text>
  <text x="136" y="22" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" font-weight="500" fill="#C8C4BE" letter-spacing="2">INDEX N° 001</text>

  <!-- Right side of meta strip -->
  <text x="680" y="22" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" font-weight="400" fill="#4A4A4A" letter-spacing="3">IN / INDIA</text>

