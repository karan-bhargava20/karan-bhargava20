  <line x1="450" y1="82" x2="840" y2="82" stroke="#2A2A2A" stroke-width="0.5"/>

  <!-- Role pills -->
  <rect x="450" y="94" width="130" height="24" fill="#E8E4DF" rx="1"/>
  <text x="460" y="111" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" font-weight="500" fill="#0D0D0D" letter-spacing="1">GEN AI</text>

  <rect x="592" y="94" width="200" height="24" fill="transparent" rx="1" stroke="#3A3A3A" stroke-width="1"/>
  <text x="602" y="111" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" font-weight="500" fill="#C8C4BE" letter-spacing="1">BACKEND DEV</text>

  <line x1="450" y1="130" x2="840" y2="130" stroke="#2A2A2A" stroke-width="0.5"/>

